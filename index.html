<html>

<head>

    <title>Login</title>
<script>

function login() {

    let username = document.getElementById("username").value;

    let password = document.getElementById("password").value;

    if (username == "admin" && password == "1234") {
        alert("Login Successful");
    }
    else {
        alert("Invalid Login");
    }
}

</script>

    <style>

        body {
            font-family: Arial;
            background-color: lightblue;
        }

        .login-box {
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: blue;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Student Login</h2>

        <input type="text"
               id="username"
               placeholder="Username">

        <input type="password"
               id="password"
               placeholder="Password">

        <button onclick="login()">Login</button>

    </div>

</body>

</html>
